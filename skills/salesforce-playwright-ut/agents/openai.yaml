interface:
  display_name: "Salesforce単体テスト実行"
  short_description: "完成版仕様書を再読込し、代理ログインとケースNo別Excel証跡でテストする"
  default_prompt: "$salesforce-playwright-ut を使い、現在の仕様書・設計書を読み直して入力規則・数式のテスト手順を確認・実装し、Playwrightで順次実行してください。エビデンスは仕様書ごとに1冊、ケースNoごとに1シート、同じ番号の枝番は同じシートに記載してください。Salesforce設定とUserレコードは変更せず、資料不足は都度確認せず根拠付きの想定で補い、実施したテストは前提付きOK／NGとして、想定・入力・期待値・実結果・検証方法・未検証範囲を記録してください。未対応処理は追加実装し、未実行や通信障害を製品の判定に置換しないでください。"
